<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <style>
      .title-main { font-family: Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #2c384e; letter-spacing: 2px; }
      .title-sub { font-family: Arial, sans-serif; font-weight: 600; font-size: 22px; fill: #2c384e; letter-spacing: 6px; }
      .label-text { font-family: Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #555; }
      .body-text { font-family: Arial, sans-serif; font-size: 11px; fill: #555; }
      .sig-name { font-family: Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #111; }
      .sig-title { font-family: Arial, sans-serif; font-size: 11px; fill: #666; }
    </style>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e6bf70"/><stop offset="50%" stop-color="#c59b27"/><stop offset="100%" stop-color="#9a7212"/></linearGradient>
  </defs>
  <rect width="1000" height="700" fill="#fff"/><rect width="1000" height="700" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="120" width="12" height="700" fill="#d99b26"/><rect x="132" width="60" height="700" fill="#2c384e"/>
  <g transform="translate(710 50)"><rect width="110" height="30" fill="#2c384e"/><text x="10" y="20" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#fff">Awraq</text><rect x="62" y="5" width="42" height="12" fill="#d99b26" rx="2"/><text x="65" y="14" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#fff">SKILLS</text></g>
  <text x="630" y="160" class="title-main" text-anchor="middle">CERTIFICATE</text><text x="630" y="195" class="title-sub" text-anchor="middle">OF ACHIEVEMENT</text>
  <text x="280" y="210" class="label-text">This certificate</text><text x="280" y="228" class="label-text">is proudly awarded to:</text>
  <line x1="340" y1="310" x2="840" y2="310" stroke="#cbd5e1"/>
  <g transform="translate(280 340)"><text class="body-text">In recognition of the successful completion of the Digital Marketing &amp; Copywriting Training</text><text y="16" class="body-text">Program, delivered by Awraq Skills.</text><text y="46" class="body-text">This program provided comprehensive training in digital marketing strategy, social media</text><text y="62" class="body-text">marketing, content creation, persuasive copywriting, SEO fundamentals, paid advertising</text><text y="78" class="body-text">basics, landing page optimization, and introductory graphic design and video editing.</text><text y="108" class="body-text">Awarded in honor of the learner's dedication, growth, and demonstrated competency</text><text y="124" class="body-text">throughout the 2-month intensive program.</text></g>
  <g transform="translate(320 520)"><path d="M10 25Q25 0 35 25T50 15T60 30T70 5T90 25" fill="none" stroke="#1e293b" stroke-width="2"/><line x1="0" y1="35" x2="160" y2="35" stroke="#94a3b8"/><text y="52" class="sig-name">LAMLAK MINWAGAW</text><text y="68" class="sig-title">Instructor &amp; Founder</text><text y="82" class="sig-title">Awraq Skills</text></g>
  <g transform="translate(430 500)" opacity=".85"><circle cx="50" cy="50" r="45" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="50" cy="50" r="40" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 2"/><text x="50" y="42" font-family="Arial, sans-serif" font-size="6" fill="#2563eb" text-anchor="middle">AWRAQ BUSINESS GROUP</text><text x="50" y="52" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#2563eb" text-anchor="middle">0970 78 45 56</text><text x="50" y="64" font-family="Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">★</text></g>
  <g transform="translate(620 520)"><rect width="200" height="42" fill="#2c384e" rx="2"/></g>
  <g transform="translate(138 300)"><path d="M-15 30-30 90-10 75 10 90-5 30Z" fill="url(#goldGradient)"/><path d="M15 30 0 90 20 75 40 90 25 30Z" fill="url(#goldGradient)"/><circle r="46" fill="url(#goldGradient)"/><circle r="38" fill="#fff"/><circle r="34" fill="url(#goldGradient)"/><path d="m-12 2 8 8L12-8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
